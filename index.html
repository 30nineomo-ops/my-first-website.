<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Official Showcase</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 60px 20px 30px;
      background: linear-gradient(180deg, #1e1b4b 0%, #0b0f19 100%);
    }

    .hero img.profile {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #a855f7;
      margin-bottom: 20px;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
    }

    .hero h1 {
      font-size: 36px;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .hero p.tagline {
      color: #c084fc;
      font-size: 18px;
      margin-bottom: 20px;
    }

    /* Container */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* EP Announcement Card */
    .ep-card {
      background: linear-gradient(135deg, #2e1065 0%, #1e293b 100%);
      border: 1px solid #7e22ce;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      margin-bottom: 30px;
    }

    .ep-badge {
      background-color: #a855f7;
      color: #0b0f19;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .ep-title {
      font-size: 28px;
      color: #ffffff;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .ep-date {
      font-size: 18px;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .pre-save-btn {
      display: inline-block;
      background: linear-gradient(90deg, #9333ea, #a855f7);
      color: #ffffff;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
      transition: transform 0.1s ease;
    }

    .pre-save-btn:active {
      transform: scale(0.97);
    }

    /* Social Links */
    .links-grid {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .social-link {
      background-color: #1e293b;
      color: #a855f7;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid #334155;
    }

    .social-link:hover {
      background-color: #a855f7;
      color: #0b0f19;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- Hero / Artist Info -->
  <header class="hero">
    <!-- Replace artist.jpg with your uploaded image filename -->
    <img src="artise.jpg" alt="blob:https://web.whatsapp.com/6eddbbc0-e345-4000-9dbd-7f6edd43930c" class="profile">
    <h1>Mighty Hovah</h1>
    <p class="tagline">Official Music & Release Hub</p>
  </header>

  <div class="container">

    <!-- Upcoming EP Section -->
    <div class="ep-card">
      <span class="ep-badge">Upcoming EP</span>
      <div class="ep-title">"11:11 Make a wish"</div>
      <div class="ep-date">🗓️ Dropping: November 20, 2026</div>
      <a href="#" class="pre-save-btn">Pre-Save EP Now 🎵</a>
    </div>

    <!-- Socials & Streaming -->
    <div class="links-grid">
      <a href="#" class="social-link">Spotify</a>
      <a href="https://music.apple.com/ng/album/feelings-feat-zii-blaze-single/6781702668" class="social-link">Apple Music</a>
      <a href="#" class="social-link">Audiomack</a>
      <a href="https://www.tiktok.com/@mightyhov?_r=1&_t=ZS-99M2w3MlIFF" class="social-link">Tiktok</a>
      <a href="https://youtube.com/channel/UCRXQy-nAMo-g1l1NqB2kT6A?si=n72v6YxwrIvsIqIR" class="social-link">YouTube</a>
    </div>

  </div>

  <footer>
    <p>© 2026 All Rights Reserved.</p>
  </footer>

</body>
</html>
