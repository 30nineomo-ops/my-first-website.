<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Developer Motivation</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background-color: #1e293b;
      padding: 35px;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .tag {
      color: #38bdf8;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 15px;
      display: block;
    }

    blockquote {
      font-size: 20px;
      line-height: 1.6;
      margin: 20px 0;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }

    button {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      background-color: #0284c7;
      color: #fff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="tag" id="adviceId">ADVICE #...</span>
    <blockquote id="adviceText">"Click the button to load your daily piece of wisdom."</blockquote>
    <button id="fetchBtn" onclick="getNewAdvice()">Get Advice 💡</button>
  </div>

  <script>
    async function getNewAdvice() {
      const adviceText = document.getElementById("adviceText");
      const adviceId = document.getElementById("adviceId");
      const button = document.getElementById("fetchBtn");

      // Set loading state
      adviceText.innerText = "Fetching wisdom from the web...";
      button.disabled = true;

      try {
        // Fetch real-time data from an open API
        const response = await fetch("https://api.adviceslip.com/advice");
        const data = await response.json();

        // Update the screen with server data
        adviceId.innerText = `ADVICE #${data.slip.id}`;
        adviceText.innerText = `"${data.slip.advice}"`;
      } catch (error) {
        adviceText.innerText = "Oops! Could not load advice. Check your internet connection.";
      } finally {
        button.disabled = false;
      }
    }

    // Automatically load one piece of advice when page first opens
    getNewAdvice();
  </script>

</body>
</html>
