<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Daily Tracker</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 16px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h2 {
      margin-top: 0;
      color: #38bdf8;
      text-align: center;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button.add-btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    button.add-btn:hover {
      background-color: #0284c7;
      color: #fff;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    li {
      background-color: #334155;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s;
    }

    li.completed span {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #f87171;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      padding: 0 5px;
    }

    .delete-btn:hover {
      color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎯 Developer Goal Tracker</h2>
    
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Press Enter or click Add...">
      <button class="add-btn" onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");

    // Load saved tasks on page startup
    document.addEventListener("DOMContentLoaded", loadTasks);

    // Allow pressing "Enter" key to add tasks
    taskInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        addTask();
      }
    });

    function addTask() {
      const text = taskInput.value.trim();
      if (text === "") return;

      createTaskElement(text, false);
      saveTasksToStorage();
      taskInput.value = "";
    }

    function createTaskElement(text, isCompleted) {
      const li = document.createElement("li");
      if (isCompleted) li.classList.add("completed");

      // Click task to strike-through / complete
      li.onclick = function(e) {
        if (e.target.tagName !== "BUTTON") {
          li.classList.toggle("completed");
          saveTasksToStorage();
        }
      };

      const span = document.createElement("span");
      span.innerText = text;

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "delete-btn";
      deleteBtn.innerText = "✕";
      deleteBtn.onclick = function() {
        li.remove();
        saveTasksToStorage();
      };

      li.appendChild(span);
      li.appendChild(deleteBtn);
      taskList.appendChild(li);
    }

    function saveTasksToStorage() {
      const tasks = [];
      document.querySelectorAll("#taskList li").forEach(li => {
        tasks.push({
          text: li.querySelector("span").innerText,
          completed: li.classList.contains("completed")
        });
      });
      localStorage.setItem("myDevTasks", JSON.stringify(tasks));
    }

    function loadTasks() {
      const saved = JSON.parse(localStorage.getItem("myDevTasks")) || [];
      saved.forEach(task => createTaskElement(task.text, task.completed));
    }
  </script>

</body>
</html>
